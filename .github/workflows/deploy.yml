name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Navigate to the folder where your project is cloned on the VPS
            # IMPORTANT: Update this path to where your project actually lives on the server
            cd /root/InstituteWeb
            
            # Pull the latest code from GitHub
            git pull origin main
            
            # Build the new Docker image and restart the container in detached mode
            docker-compose up -d --build
            
            # Optional: Clean up unused Docker images to free up space
            docker image prune -f
